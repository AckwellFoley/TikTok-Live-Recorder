name: Test, audit and build Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare verified video engine for integration tests
        shell: pwsh
        run: |
          $engine = python -c "import sys;sys.path.insert(0,'src');from video_engine import ensure_ffmpeg;print(ensure_ffmpeg('build/ci-engine'))"
          Split-Path $engine | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Regression tests
        run: python -m pytest -q
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements-lock.txt --no-deps --disable-pip --format json --output dependency-audit.json
      - name: Build portable release
        run: python tools/build_release.py
      - name: Check archive contents
        run: python tools/verify_release.py release-artifacts/TikTok-Live-Recorder-1.3.0-Windows-x64.zip release-artifacts/TikTok-Live-Recorder-1.3.0-Source.zip
      - name: Packaged runtime and worker smoke test
        shell: pwsh
        run: |
          & '.\dist\TikTok-Live-Recorder\recorder-worker.exe' --self-test "$env:GITHUB_WORKSPACE\release-artifacts\packaged-smoke.json"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged smoke test failed' }
      - name: Scan extracted application
        shell: pwsh
        run: tools/scan_release.ps1 -Target dist/TikTok-Live-Recorder -Report release-artifacts/defender-app.json
      - name: Scan portable ZIP
        shell: pwsh
        run: tools/scan_release.ps1 -Target release-artifacts/TikTok-Live-Recorder-1.3.0-Windows-x64.zip -Report release-artifacts/defender-zip.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-release-and-reports
          path: |
            release-artifacts/TikTok-Live-Recorder-1.3.0-Windows-x64.zip
            release-artifacts/TikTok-Live-Recorder-1.3.0-Source.zip
            release-artifacts/SHA256SUMS.txt
            release-artifacts/*smoke.json
            release-artifacts/defender-*.json
            dependency-audit.json
